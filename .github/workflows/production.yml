name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false # waiting to current deploy finish

env:
  REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/workspace-be/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'apps/workspace-fe/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

  unit-test:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test --workspace=apps/workspace-be

  deploy-backend:
    name: Deploy Backend → Production
    needs: [changes, unit-test] # must pass test to deploy
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/workspace-be/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/workspace-be:${{ github.sha }}
            ${{ env.REGISTRY }}/workspace-be:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/workspace-be:latest
          cache-to: type=inline

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name workspace-be \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/workspace-be:${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend → Production
    needs: [changes, unit-test] # must pass test to deploy
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/workspace-fe/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/workspace-fe:${{ github.sha }}
            ${{ env.REGISTRY }}/workspace-fe:latest
          build-args: |
            VITE_BACKEND_URL=${{ secrets.PROD_BACKEND_URL }}
            VITE_WEBSOCKET_URL=${{ secrets.PROD_WEBSOCKET_URL }}
            VITE_ICE_SERVERS_URL=${{ secrets.VITE_ICE_SERVERS_URL }}
            VITE_KEYCLOAK_URL=${{ secrets.PROD_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ secrets.KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.KEYCLOAK_CLIENT_ID }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/workspace-fe:latest
          cache-to: type=inline

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name workspace-fe \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/workspace-fe:${{ github.sha }}
